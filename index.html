<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Terminal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d1117;
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .terminal {
      width: 100%;
      max-width: 800px;
      height: 500px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .terminal-header {
      background: #21262d;
      padding: 10px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #30363d;
    }
    .buttons {
      display: flex;
      gap: 8px;
    }
    .btn {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .close { background-color: #ff5f56; }
    .minimize { background-color: #ffbd2e; }
    .maximize { background-color: #27c93f; }
    .title {
      color: #8b949e;
      font-size: 14px;
      margin-left: auto;
      margin-right: auto;
    }
    .terminal-body {
      padding: 15px;
      flex-grow: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .output {
      margin-bottom: 10px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .input-line {
      display: flex;
      align-items: center;
    }
    .prompt {
      color: #58a6ff;
      margin-right: 8px;
      font-weight: bold;
    }
    input {
      background: transparent;
      border: none;
      color: #00ff66;
      font-family: inherit;
      font-size: 16px;
      flex-grow: 1;
      outline: none;
    }
    .system-msg { color: #8b949e; }
    .error { color: #ff7b72; }
  </style>
</head>
<body>

<div class="terminal">
  <div class="terminal-header">
    <div class="buttons">
      <div class="btn close"></div>
      <div class="btn minimize"></div>
      <div class="btn maximize"></div>
    </div>
    <div class="title">guest@github-pages:~</div>
  </div>
  <div class="terminal-body" id="terminal-body">
    <div class="output system-msg">
Bienvenido a la Web Terminal v1.0.0
Escribe <span style="color:#f2cc60;">'help'</span> para ver la lista de comandos disponibles.
--------------------------------------------------
    </div>
    <div id="history"></div>
    <div class="input-line">
      <span class="prompt">guest@web:~$</span>
      <input type="text" id="command-input" autofocus autocomplete="off">
    </div>
  </div>
</div>

<script>
  const input = document.getElementById('command-input');
  const history = document.getElementById('history');
  const terminalBody = document.getElementById('terminal-body');

  const commands = {
    'help': 'Comandos disponibles:\n - help    : Muestra este mensaje\n - clear   : Limpia la pantalla\n - date    : Muestra la fecha y hora actual\n - echo    : Repite el texto que escribas (ej: echo hola)\n - repo    : Enlace al repositorio\n - matrix  : Mensaje especial',
    'date': () => new Date().toLocaleString(),
    'repo': 'Puedes ver el código de este proyecto en tu repositorio de GitHub.',
    'matrix': 'Wake up, Neo... The Matrix has you.'
  };

  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      const fullCommand = input.value.trim();
      const args = fullCommand.split(' ');
      const cmd = args[0].toLowerCase();
      
      if (fullCommand !== '') {
        printLine(`guest@web:~$ ${fullCommand}`, 'prompt');
        processCommand(cmd, args.slice(1).join(' '));
      }

      input.value = '';
      terminalBody.scrollTop = terminalBody.scrollHeight;
    }
  });

  function processCommand(cmd, textArgs) {
    if (cmd === 'clear') {
      history.innerHTML = '';
      return;
    }

    if (cmd === 'echo') {
      printLine(textArgs || '');
      return;
    }

    if (commands[cmd]) {
      const response = typeof commands[cmd] === 'function' ? commands[cmd]() : commands[cmd];
      printLine(response);
    } else {
      printLine(`Comando no encontrado: '${cmd}'. Escribe 'help' para ver los comandos.`, 'error');
    }
  }

  function printLine(text, className = '') {
    const div = document.createElement('div');
    div.className = `output ${className}`;
    div.textContent = text;
    history.appendChild(div);
  }

  // Mantener el foco en el input al hacer clic en la terminal
  document.querySelector('.terminal').addEventListener('click', () => input.focus());
</script>

</body>
</html>
