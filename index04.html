<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linux Real en el Navegador (v86)</title>

  <!-- Script de v86 -->
  <script src="https://copy.sh/v86/build/v86_all.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d1117;
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .terminal {
      width: 100%;
      max-width: 850px;
      height: 540px;
      background: #000000;
      border: 1px solid #30363d;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .terminal-header {
      background: #21262d;
      padding: 10px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #30363d;
    }
    .buttons { display: flex; gap: 8px; }
    .btn { width: 12px; height: 12px; border-radius: 50%; }
    .close { background-color: #ff5f56; }
    .minimize { background-color: #ffbd2e; }
    .maximize { background-color: #27c93f; }
    .title { color: #8b949e; font-size: 14px; margin: 0 auto; }
    
    /* Contenedor donde v86 dibuja la pantalla */
    #screen_container {
      flex-grow: 1;
      padding: 10px;
      overflow: auto;
      white-space: pre;
      font-family: monospace;
      color: #00ff66;
    }
  </style>
</head>
<body>

<div class="terminal">
  <div class="terminal-header">
    <div class="buttons">
      <div class="btn close"></div>
      <div class="btn minimize"></div>
      <div class="btn maximize"></div>
    </div>
    <div class="title">root@v86-linux:~</div>
  </div>

  <!-- AQUÍ SE RENDERIZA LA PANTALLA DE V86 -->
  <div id="screen_container">
    <div style="white-space: pre; font-family: monospace;">Iniciando emulador x86... Por favor espera.</div>
  </div>
</div>

<script>
  // Inicialización del emulador v86
  const emulator = new V86Starter({
    wasm_path: "https://copy.sh/v86/build/v86.wasm",
    memory_size: 128 * 1024 * 1024, // 128 MB RAM
    vga_bios: { url: "https://copy.sh/v86/bios/vgabios.bin" },
    bios: { url: "https://copy.sh/v86/bios/seabios.bin" },
    // Imagen liviana de Linux (Alpine / Buildroot)
    cdrom: { url: "https://copy.sh/v86/images/linux.iso" },
    autostart: true,
    // VÍNCULO OBLIGATORIO AL CONTENEDOR HTML:
    screen_container: document.getElementById("screen_container")
  });
</script>

</body>
</html>
